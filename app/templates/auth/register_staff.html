{% extends "base.html" %}

{% block title %}Register Staff — CyberAware{% endblock %}

{% block content %}
<div class="row justify-content-center my-4">
  <div class="col-md-6">
    <div class="glass-card p-4">
      <div class="text-center mb-4">
        <h2 class="fw-bold">Staff Registration</h2>
        <p class="text-muted small">Self-identify securely to participate in security awareness training assessments</p>
      </div>

      <form method="POST" action="{{ url_for('auth.register') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

        <div class="row g-3">
          <div class="col-md-6">
            <label for="full_name" class="form-label fw-semibold">Full Name</label>
            <input type="text" class="form-control" id="full_name" name="full_name" placeholder="e.g. Zainab Damina" required>
          </div>

          <div class="col-md-6">
            <label for="department" class="form-label fw-semibold">Department</label>
            <input type="text" class="form-control" id="department" name="department" placeholder="e.g. Information Assurance">
          </div>

          <div class="col-md-6">
            <label for="username" class="form-label fw-semibold">Username</label>
            <input type="text" class="form-control" id="username" name="username" placeholder="e.g. zainab" required>
          </div>

          <div class="col-md-6">
            <label for="email" class="form-label fw-semibold">Email Address</label>
            <input type="email" class="form-control" id="email" name="email" placeholder="zainab@cyberaware.local" required>
          </div>

          <div class="col-md-6">
            <label for="password" class="form-label fw-semibold">Password</label>
            <input type="password" class="form-control" id="password" name="password" minlength="8" required>
            <div class="form-text">Must be at least 8 characters.</div>
          </div>

          <div class="col-md-6">
            <label for="confirm_password" class="form-label fw-semibold">Confirm Password</label>
            <input type="password" class="form-control" id="confirm_password" name="confirm_password" minlength="8" required>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 mt-4 fw-semibold shadow-sm">
          <i class="bi bi-person-plus me-1"></i> Register Account
        </button>
      </form>

      <div class="text-center text-muted small mt-3">
        Already registered? <a href="{{ url_for('auth.login') }}" class="text-primary fw-semibold">Log In</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
