{% extends "base.html" %}
{% block title %}400 Bad Request — CyberAware{% endblock %}
{% block content %}
<div class="text-center py-5">
  <h1 class="display-1 text-warning fw-bold">400</h1>
  <h2>Bad Request</h2>
  <p class="text-muted">The server could not process the request due to invalid parameters or missing CSRF validation.</p>
  <a href="{{ url_for('index') }}" class="btn btn-warning mt-3"><i class="bi bi-arrow-left me-1"></i> Return Home</a>
</div>
{% endblock %}
